<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网络代理</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">⇄</div>
        <div>
          <h1>网络代理</h1>
          <p class="subtitle">本地端口转发</p>
        </div>
      </div>
      <div class="status">
        <span id="statusDot" class="dot stopped"></span>
        <span id="statusText">已停止</span>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div class="row">
          <div class="field port">
            <label>本地端口</label>
            <input id="port" type="text" placeholder="3100" />
          </div>
          <div class="field">
            <label>转发地址</label>
            <input id="proxyAddr" type="text" placeholder="http://127.0.0.1:8080" />
          </div>
        </div>
      </section>

      <div class="actions">
        <button id="startBtn" class="btn primary">启动</button>
        <button id="stopBtn" class="btn danger" disabled>停止</button>
      </div>
      <div id="msg" class="msg"></div>

      <section class="card logs-card">
        <div class="logs-header">
          <h2>运行日志</h2>
          <button id="clearBtn" class="btn ghost">清空</button>
        </div>
        <div id="logs" class="logs"></div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
